name: update-list

on:
  schedule:
    # 每天 07:00 北京时间 (UTC 23:00)
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 生成脚本只依赖标准库,无需 pip install
      - name: Generate list
        run: python3 generate.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nonchina_ip_list.txt
          if git diff --staged --quiet; then
            echo "清单无变化,跳过提交"
          else
            git commit -m "chore: update list ($(date -u '+%Y-%m-%d') $(wc -l < nonchina_ip_list.txt) entries)"
            git push
          fi
